name: Build Mi Huerto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los archivos del repositorio
        uses: actions/checkout@v4

      - name: Comprobar que está el proyecto Android
        run: |
          if [ ! -f mi_huerto_android_project.zip ]; then
            echo "Falta mi_huerto_android_project.zip en la raíz del repositorio."
            echo "Sube ese archivo a GitHub y vuelve a intentarlo."
            exit 1
          fi

      - name: Descomprimir el proyecto Android
        run: unzip -q mi_huerto_android_project.zip -d android-project

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes de Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar el APK
        working-directory: android-project/mi_huerto_android
        run: gradle --no-daemon assembleDebug

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: mi-huerto-apk
          path: android-project/mi_huerto_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
