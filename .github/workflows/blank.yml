name: Build Mi Huerto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Descargar los archivos del repositorio
        uses: actions/checkout@v4

      - name: Localizar el proyecto Android
        id: project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'mi_huerto_android_project*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encuentra el ZIP del proyecto Android."
            ls -la
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Descomprimir el proyecto Android
        run: unzip -q "${{ steps.project.outputs.zip_file }}" -d android-project

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Comprobar estructura del proyecto
        run: |
          test -f android-project/mi_huerto_android/settings.gradle
          test -f android-project/mi_huerto_android/app/build.gradle
          test -f android-project/mi_huerto_android/app/src/main/AndroidManifest.xml

      - name: Compilar el APK
        working-directory: android-project/mi_huerto_android
        run: gradle --no-daemon assembleDebug

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: mi-huerto-apk
          path: android-project/mi_huerto_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
